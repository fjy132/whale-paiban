  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="alternate icon" href="favicon.svg?v=2">
  <link rel="apple-touch-icon" href="favicon.svg?v=2">

  <!-- Markdown 渲染库 / Vue（同源 vendor） -->
  <script src="vendor/markdown-it.min.js" defer></script>
  <script src="vendor/vue.global.prod.js" defer></script>

  <style>
    /* ============ 设计令牌 ============ */
    :root {
      --bg: #F3F4F6;
      --panel: #FFFFFF;
      --panel-2: #FAFAFB;
      --ink: #18181B;
      --text-2: #3F3F46;
      --muted: #71717A;
      --faint: #A1A1AA;
      --hairline: #E4E4E7;
      --hairline-2: #D4D4D8;
      --primary: #7C3AED;
      --primary-strong: #6D28D9;
      --primary-soft: rgba(124, 58, 237, 0.12);
      --pink: #EC4899;
      --canvas-dot: rgba(24, 24, 27, 0.10);
      --shadow-sm: 0 1px 2px rgba(16,24,40,0.05), 0 2px 8px rgba(16,24,40,0.05);
      --shadow-md: 0 2px 6px rgba(16,24,40,0.06), 0 16px 40px rgba(16,24,40,0.12);
      --r: 12px;
      --r-sm: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; }
    svg { display: block; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(161,161,170,0.45); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(161,161,170,0.7); }
    ::-webkit-scrollbar-track { background: transparent; }

    .app-shell { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

    /* ============ 顶部栏 ============ */
    .topbar {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--hairline);
      z-index: 40;
    }
    .brand { display: flex; align-items: center; gap: 10px; user-select: none; }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 9px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--pink) 100%);
      color: #fff; font-size: 15px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 10px var(--primary-soft);
      transition: transform 0.3s var(--ease);
    }
    .brand:hover .brand-mark { transform: rotate(-8deg) scale(1.06); }
    .brand-name { font-size: 16.5px; font-weight: 800; letter-spacing: 0.01em; }
    .brand-slogan { font-size: 12px; color: var(--faint); font-weight: 600; margin-left: 2px; }
    .top-actions { display: flex; align-items: center; gap: 9px; }

    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      border: 1px solid transparent; border-radius: 9px;
      font-size: 13.5px; font-weight: 600;
      padding: 9px 15px; color: var(--ink);
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn.primary { background: var(--primary); color: #fff; box-shadow: 0 2px 10px var(--primary-soft); }
    .btn.primary:hover { background: var(--primary-strong); }
    .btn.primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.ghost { background: var(--panel); border-color: var(--hairline-2); color: var(--text-2); }
    .btn.ghost:hover { border-color: var(--faint); color: var(--ink); }
    .btn.sm { padding: 7px 12px; font-size: 12.5px; border-radius: 8px; }

    /* ============ 三栏编辑器 ============ */
    .editor {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: 10% 50% 40%;
    }
    .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .panel-title { font-size: 14px; font-weight: 800; letter-spacing: 0.01em; }
    .hint { font-size: 12px; color: var(--faint); font-weight: 600; }

    /* ---- 左：模板库 ---- */
    .left-panel {
      display: flex; flex-direction: column; min-height: 0;
      background: var(--panel); border-right: 1px solid var(--hairline);
      padding: 12px 8px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .search {
      display: flex; align-items: center; gap: 8px;
      border: 1px solid var(--hairline-2); border-radius: 9px;
      background: var(--panel-2); padding: 8px 11px; margin-bottom: 12px;
      color: var(--faint);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      flex: none;
    }
    .search:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .search input { border: none; background: transparent; outline: none; font-family: inherit; font-size: 13px; color: var(--ink); width: 100%; }
    .search input::placeholder { color: var(--faint); }

    .tpl-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding: 2px; }
    .tpl-card {
      position: relative;
      background: var(--panel-2); border: 1.5px solid var(--hairline);
      border-radius: 7px;
      cursor: pointer;
      padding: 8px 9px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .tpl-card:hover { border-color: var(--faint); }
    .tpl-card.selected { border-color: var(--primary); background: var(--primary-soft); }
    .tpl-name { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tpl-empty { text-align: center; color: var(--faint); font-size: 12px; padding: 30px 0; }
    .tpl-foot { flex-shrink: 0; padding-top: 8px; font-size: 10.5px; color: var(--faint); text-align: center; }

    /* ---- 中：画布 ---- */
    .canvas { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .center-head {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 16px; background: var(--panel);
      border-bottom: 1px solid var(--hairline); z-index: 5;
    }
    .center-title { font-size: 14px; font-weight: 800; letter-spacing: 0.01em; }
    .canvas-dots {
      flex: 1; min-width: 0; overflow: auto;
      background-color: var(--bg);
      background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1px);
      background-size: 18px 18px;
      padding: 32px;
      display: flex; justify-content: center; align-items: flex-start;
    }
    .page {
      background: #fff;
      box-shadow: 0 1px 3px rgba(16,24,40,0.1), 0 12px 40px rgba(16,24,40,0.16);
      width: 600px; max-width: 100%;
      border-radius: 6px;
      overflow: hidden;
    }
    .preview-area { min-height: 600px; background: #fff; padding: 6px 10px; }
    .preview-container { max-width: 720px; margin: 0 auto; padding: 20px 32px 48px 32px; line-height: 1.8; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 560px; color: var(--faint); font-size: 13.5px; text-align: center; padding: 0 40px; }

    /* ---- 右：编辑 ---- */
    .right-panel {
      display: flex; flex-direction: column; min-height: 0;
      background: var(--panel); border-left: 1px solid var(--hairline);
      padding: 16px 14px;
    }
    .ins-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; flex: none; }
    .ins-label { font-size: 11.5px; font-weight: 700; color: var(--faint); margin-right: 2px; }
    .ins-btn {
      border: 1px solid var(--hairline-2); background: var(--panel-2);
      color: var(--text-2); font-size: 12px; font-weight: 600; font-family: inherit;
      padding: 5px 10px; border-radius: 999px;
      transition: all 0.18s ease;
    }
    .ins-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
    .input-area {
      flex: 1; min-height: 120px; resize: none;
      border: 1px solid var(--hairline-2); border-radius: var(--r-sm);
      background: var(--panel-2); color: var(--ink);
      padding: 13px 14px; font-size: 13.5px; line-height: 1.85;
      font-family: inherit; outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .input-area:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); background: var(--panel); }
    .input-area::placeholder { color: var(--faint); }
    .input-area.drag-over { border-color: var(--primary); background: var(--primary-soft); }
    .right-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; flex: none; }
    .word-count { font-size: 12.5px; color: var(--muted); font-weight: 600; }

    /* ============ 样式调整面板 ============ */
    .style-panel { flex: none; margin-top: 12px; border: 1px solid var(--hairline); border-radius: 10px; overflow: hidden; background: var(--panel-2); }
    .style-panel-head {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; border: none; background: transparent;
      font-size: 12.5px; font-weight: 700; color: var(--text-2); font-family: inherit;
    }
    .style-chev { transition: transform 0.25s var(--ease); color: var(--faint); font-size: 11px; }
    .style-chev.open { transform: rotate(180deg); }
    .style-panel-body { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 9px; border-top: 1px solid var(--hairline); max-height: 40vh; overflow-y: auto; }
    .srow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .srow > label { font-size: 12px; color: var(--muted); font-weight: 600; flex-shrink: 0; }
    .srow select {
      flex: 1; max-width: 150px; font-family: inherit; font-size: 12px; font-weight: 600; color: var(--ink);
      background: var(--panel); border: 1px solid var(--hairline-2); border-radius: 7px;
      padding: 5px 8px; outline: none;
    }
    .srow select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .srow .seg { display: inline-flex; border: 1px solid var(--hairline-2); border-radius: 7px; overflow: hidden; background: var(--panel); }
    .srow .seg button { border: none; background: transparent; font-family: inherit; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 5px 9px; }
    .srow .seg button + button { border-left: 1px solid var(--hairline-2); }
    .srow .seg button.on { background: var(--primary); color: #fff; }
    .swatches { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .sw {
      width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--hairline-2);
      background: var(--c, transparent); padding: 0; cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .sw:hover { transform: scale(1.12); }
    .sw.on { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
    .sw-text { width: auto; height: auto; border-radius: 999px; padding: 3px 9px; font-size: 10.5px; font-weight: 700; color: var(--muted); background: var(--panel); }
    .sw-text.on { color: var(--primary); border-color: var(--primary); }
    .style-reset { align-self: flex-start; margin-top: 2px; }
    .style-hint { font-size: 11px; line-height: 1.6; color: var(--muted); background: var(--primary-soft); border-radius: 8px; padding: 7px 10px; }
    .img-selected { outline: 3px solid var(--primary) !important; outline-offset: 2px; }

    /* ============ 底部栏 ============ */
    .footer {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
      padding: 9px 20px; border-top: 1px solid var(--hairline);
      font-size: 12px; color: var(--faint);
    }
    .foot-keys { font-size: 11px; color: var(--faint); }

    /* ============ 响应式 ============ */
    @media (max-width: 1180px) {
      .editor { grid-template-columns: 12% 48% 40%; }
    }
    @media (max-width: 960px) {
      .app-shell { height: auto; min-height: 100vh; }
      .editor { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
      .left-panel { border-right: none; border-bottom: 1px solid var(--hairline); max-height: 260px; }
      .right-panel { border-left: none; border-top: 1px solid var(--hairline); height: 320px; }
      .canvas-dots { padding: 18px; }
      .page { width: 100%; }
      .brand-slogan { display: none; }
    }
  </style>
</head>
<body>
<div id="app" class="app-shell">

  <!-- ===== 顶部栏 ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">鲸</span>
      <span class="brand-name">鲸鱼排版小工具</span>
      <span class="brand-slogan">智能排版 · 一键美化 · 粘贴即用</span>
    </div>
    <div class="top-actions">
      <button type="button" class="btn ghost" @click="clearContent">清空</button>
      <button type="button" class="btn primary" @click="copyToClipboard" :disabled="!renderedContent">
        {{ copySuccess ? '✓ 已复制' : '复制到公众号' }}
      </button>
    </div>
  </header>

  <!-- ===== 三栏编辑器 ===== -->
  <div class="editor">

    <!-- 左：模板库 -->
    <aside class="left-panel">
      <div class="panel-head">
        <span class="panel-title">模板</span>
        <span class="hint">{{ filteredStyles.length }}</span>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" v-model="tplSearch" placeholder="搜索" autocomplete="off">
      </div>
      <div class="tpl-list">
        <div
          v-for="item in filteredStyles"
          :key="item.key"
          class="tpl-card"
          :class="{ selected: currentStyle === item.key }"
          @click="currentStyle = item.key"
        >
          <span class="tpl-name">{{ item.style.name }}</span>
        </div>
        <div v-if="filteredStyles.length === 0" class="tpl-empty">无匹配</div>
      </div>
    </aside>

    <!-- 中：画布 -->
    <section class="canvas">
      <div class="center-head">
        <span class="center-title">预览效果</span>
        <button type="button" class="btn primary sm" @click="copyToClipboard" :disabled="!renderedContent">复制到公众号</button>
      </div>
      <div class="canvas-dots">
        <div class="page">
          <div class="preview-area" ref="previewScroll" @click="onPreviewClick">
            <div v-if="!renderedContent" class="empty-state">
              <p>在右侧粘贴文字，左边选一个模板，这里实时预览排版效果</p>
            </div>
            <div v-else class="preview-container" v-html="renderedContent"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 右：编辑 -->
    <aside class="right-panel">
      <div class="panel-head">
        <span class="panel-title">文章内容</span>
        <span class="word-count">{{ markdownInput.length }} 字</span>
      </div>
      <div class="ins-bar">
        <span class="ins-label">插入</span>
        <button type="button" class="ins-btn" @click="insertMarkdown('# ')">主标题</button>
        <button type="button" class="ins-btn" @click="insertMarkdown('## ')">小标题</button>
        <button type="button" class="ins-btn" @click="insertMarkdown('&gt; ')">引用</button>
        <button type="button" class="ins-btn" @click="insertMarkdown('- ')">列表</button>
        <button type="button" class="ins-btn" @click="insertMarkdown('---\n')">分隔线</button>
      </div>
      <textarea
        ref="editorTextarea"
        v-model="markdownInput"
        class="input-area"
        :style="inputAreaStyle"
        :class="{ 'drag-over': isDraggingOver }"
        @paste="handleSmartPaste"
        @drop="handleDrop"
        @dragover="handleDragOver"
        @dragenter="handleDragEnter"
        @dragleave="handleDragLeave"
        placeholder="在这里粘贴你的文章内容……
支持从飞书 / Notion / Word 直接粘贴，也可以拖拽或粘贴图片。"
        spellcheck="false"
      ></textarea>
      <div class="right-foot">
        <span class="word-count">{{ markdownInput.length }} 字</span>
        <button type="button" class="btn primary sm" @click="smartFormat">一键排版</button>
      </div>

      <!-- 选区样式：只作用于选中的文字 / 点选的图片 -->
      <div class="style-panel">
        <button type="button" class="style-panel-head" @click="styleOpen = !styleOpen">
          <span>选区样式（选中文字 / 点选图片）</span>
          <span class="style-chev" :class="{ open: styleOpen }">▾</span>
        </button>
        <div class="style-panel-body" v-show="styleOpen">
          <p class="style-hint">先在中间预览里「选中文字」或「点一下图片」，再点下面的按钮 —— 只作用于选中的部分，不会改动全文。</p>

          <div class="srow">
            <label>文字</label>
            <div class="seg">
              <button type="button" @click="applyTextStyle('font-weight', 'bold')"><b>B</b></button>
              <button type="button" @click="applyTextStyle('font-style', 'italic')"><i>I</i></button>
              <button type="button" @click="applyTextStyle('text-decoration', 'underline')"><u>U</u></button>
            </div>
          </div>
          <div class="srow">
            <label>字号</label>
            <div class="seg">
              <button type="button" @click="applyTextStyle('font-size', '14px')">小</button>
              <button type="button" @click="applyTextStyle('font-size', '16px')">中</button>
              <button type="button" @click="applyTextStyle('font-size', '20px')">大</button>
              <button type="button" @click="applyTextStyle('font-size', '24px')">超大</button>
            </div>
          </div>
          <div class="srow">
            <label>首行缩进</label>
            <div class="seg">
              <button type="button" @click="applyIndent('2em')">缩进 2 字</button>
              <button type="button" @click="applyIndent('0')">取消</button>
            </div>
          </div>
          <div class="srow">
            <label>文字色</label>
            <div class="swatches">
              <button type="button" class="sw" style="--c:#3f3f46" @click="applyTextStyle('color', '#3f3f46')" title="深灰"></button>
              <button type="button" class="sw" style="--c:#18181b" @click="applyTextStyle('color', '#18181b')" title="墨黑"></button>
              <button type="button" class="sw" style="--c:#dc2626" @click="applyTextStyle('color', '#dc2626')" title="红"></button>
              <button type="button" class="sw" style="--c:#ea580c" @click="applyTextStyle('color', '#ea580c')" title="橙"></button>
              <button type="button" class="sw" style="--c:#2563eb" @click="applyTextStyle('color', '#2563eb')" title="蓝"></button>
              <button type="button" class="sw" style="--c:#16a34a" @click="applyTextStyle('color', '#16a34a')" title="绿"></button>
              <button type="button" class="sw" style="--c:#7c3aed" @click="applyTextStyle('color', '#7c3aed')" title="紫"></button>
            </div>
          </div>

          <div class="srow">
            <label>图片宽度</label>
            <div class="seg">
              <button type="button" @click="applyImageStyle('width', '100%')">100%</button>
              <button type="button" @click="applyImageStyle('width', '60%')">60%</button>
              <button type="button" @click="applyImageStyle('width', '40%')">40%</button>
            </div>
          </div>
          <div class="srow">
            <label>图片圆角</label>
            <div class="seg">
              <button type="button" @click="applyImageStyle('border-radius', '0px')">0</button>
              <button type="button" @click="applyImageStyle('border-radius', '8px')">8</button>
              <button type="button" @click="applyImageStyle('border-radius', '16px')">16</button>
            </div>
          </div>
          <div class="srow">
            <label>图片对齐</label>
            <div class="seg">
              <button type="button" @click="applyImageStyle('align', 'left')">左</button>
              <button type="button" @click="applyImageStyle('align', 'center')">中</button>
              <button type="button" @click="applyImageStyle('align', 'right')">右</button>
            </div>
          </div>
          <button type="button" class="btn ghost sm style-reset" @click="applyTextStyle('clear', '')">清除选中文字格式</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- ===== 底部栏 ===== -->
  <footer class="footer">
    <span>鲸鱼排版小工具 · 内容仅在本地处理，不会上传</span>
    <span class="foot-keys">选中文字后点「复制到公众号」即可</span>
  </footer>

  <!-- Toast 提示 -->
  <div v-if="toast.show" class="toast" :class="toast.type">{{ toast.message }}</div>
</div>

<style>
  /* Toast（放在最后覆盖，避免被上方样式影响） */
  .toast {
    position: fixed; top: 50%; left: 50%; z-index: 1000;
    transform: translate(-50%, -50%) scale(0.96);
    background: #fff; color: #18181B;
    border: 1px solid #D4D4D8; border-radius: 14px;
    box-shadow: 0 2px 6px rgba(16,24,40,0.06), 0 16px 40px rgba(16,24,40,0.16);
    padding: 20px 30px; text-align: center; min-width: 200px;
    font-size: 13.5px; font-weight: 600;
    animation: toastIn 0.25s cubic-bezier(0.22,1,0.36,1) both;
  }
  .toast.error { color: #B45309; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -46%) scale(0.96); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
</style>

<!-- 静态外壳 textarea 交接（供 app.js 读取草稿） -->
<script>
  (function () {
    try {
      var ta = document.querySelector('#app .input-area');
      if (ta) {
        window.__shellTextarea = ta;
        window.__shellReadyTime = performance.now();
      }
    } catch (e) {}
  })();
</script>

<script src="styles.js?v=36" defer></script>
<script src="app.js?v=36" defer></script>
</body>
</html>
